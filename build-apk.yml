name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install npm dependencies
        run: npm install

      - name: Add Android platform (only if it does not exist yet)
        id: add_platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
            echo "created=true" >> "$GITHUB_OUTPUT"
          else
            echo "created=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Add required permissions to AndroidManifest.xml (checks each one individually, safe to re-run)
        run: |
          python3 - << 'PYEOF'
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              content = f.read()
          required_perms = [
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.USE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.USE_BIOMETRIC" />',
          ]
          # Add only whichever of these aren't already present — each checked independently,
          # so this stays correct even after the manifest already has some of them from a prior run.
          missing = [p for p in required_perms if p not in content]
          if missing:
              insertion = "    " + "\n    ".join(missing) + "\n"
              content = content.replace("</manifest>", insertion + "</manifest>")
              with open(path, "w") as f:
                  f.write(content)
          print(content)
          PYEOF

      - name: Commit the android/ folder back to the repo (first run only)
        if: steps.add_platform.outputs.created == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add android
          git commit -m "Add generated android/ platform folder (auto-committed by CI)"
          git push

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: the-paths-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
